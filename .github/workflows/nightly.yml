name: Nightly network smoke tests

on:
  schedule:
    - cron: "20 18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Run ignored network smoke tests
        run: >-
          cargo test --all-targets -- --ignored --test-threads=1
          --skip data::eastmoney::market_board_tests
          --skip data::eastmoney::universe_list_tests
      # Eastmoney's push2 edge blocks `clist` requests from datacenter IPs
      # after only a few calls (HTTP 502 across every host for minutes, even
      # when paced at 1s+; verified Oct 2026). The board/universe tests can
      # only be checked best-effort from GitHub runners, so they stay visible
      # in the run but do not fail the nightly. Run them from a China-based
      # network (or via a proxy) when a hard check is required.
      - name: Run Eastmoney board smoke tests (advisory; WAF-limited from CI)
        continue-on-error: true
        run: >-
          cargo test --bin stock -- --ignored --test-threads=1
          data::eastmoney::market_board_tests
          data::eastmoney::universe_list_tests
