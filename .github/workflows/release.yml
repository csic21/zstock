name: Release

on:
  push:
    branches: [main]
    paths: ['.github/release-request.json']
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    permissions:
      contents: write
    name: Resolve and validate release source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      publication_head: ${{ steps.resolve.outputs.publication_head }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve source and create or verify release tag
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const { resolveRelease } = require('./scripts/resolve-release.cjs');
            await resolveRelease({ github, context, core });

  quality:
    needs: resolve
    uses: ./.github/workflows/quality.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}

  windows:
    name: Windows (x64)
    needs: [resolve, quality]
    runs-on: windows-latest
    outputs:
      windows_sha: ${{ steps.hash.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify version matches tag
        if: needs.resolve.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          cargo_version="$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml | head -1)"
          tag_version="${RELEASE_TAG#v}"
          if [ -z "$cargo_version" ] || [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::Version mismatch: Cargo.toml=${cargo_version:-<missing>} tag=${tag_version}"
            exit 1
          fi
          echo "OK: Cargo.toml version ${cargo_version} matches tag ${tag_version}"

      - name: Build release
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\zstock-windows-x64 | Out-Null
          Copy-Item target\release\stock.exe dist\zstock-windows-x64\
          Copy-Item README.md dist\zstock-windows-x64\ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\zstock-windows-x64 -DestinationPath dist\zstock-windows-x64.zip -Force

      - name: Compute version
        id: version
        shell: bash
        run: |
          cargo_version="$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml | head -1)"
          test -n "$cargo_version" || { echo "::error::could not read version from Cargo.toml"; exit 1; }
          echo "ver=${cargo_version}" >> "$GITHUB_OUTPUT"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" -ErrorAction Stop
          & $iscc.FullName "/DAppVersion=${{ steps.version.outputs.ver }}" "assets\windows\installer.iss"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ISCC failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          if (-not (Test-Path "dist\zstock-windows-x64-setup.exe")) {
            Write-Error "installer was not produced"
            exit 1
          }

      - name: Hash package
        id: hash
        shell: bash
        run: echo "sha=$(shasum -a 256 dist/zstock-windows-x64.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zstock-windows-x64
          if-no-files-found: error
          path: |
            dist/zstock-windows-x64.zip
            dist/zstock-windows-x64-setup.exe

  macos:
    name: macOS (arm64 + x64)
    needs: [resolve, quality]
    runs-on: macos-15
    outputs:
      macos_arm64_sha: ${{ steps.hash.outputs.arm64 }}
      macos_x64_sha: ${{ steps.hash.outputs.x64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify version matches tag
        if: needs.resolve.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          cargo_version="$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml | head -1)"
          tag_version="${RELEASE_TAG#v}"
          if [ -z "$cargo_version" ] || [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::Version mismatch: Cargo.toml=${cargo_version:-<missing>} tag=${tag_version}"
            exit 1
          fi
          echo "OK: Cargo.toml version ${cargo_version} matches tag ${tag_version}"

      - name: Sync Info.plist version
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        if: needs.resolve.outputs.publish == 'true'
        run: |
          tag_version="${RELEASE_TAG#v}"
          plutil -replace CFBundleShortVersionString -string "$tag_version" assets/macos/Info.plist
          plutil -replace CFBundleVersion -string "$tag_version" assets/macos/Info.plist

      - name: Build release (x86_64 + arm64)
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin

      - name: Package .app + DMG + PKG (arm64)
        run: |
          mkdir -p target/release
          cp target/aarch64-apple-darwin/release/stock target/release/stock
          SKIP_CARGO_BUILD=1 ./scripts/package-macos.sh
          cd dist
          ditto -c -k --keepParent "ZStock.app" zstock-macos-arm64.zip
          cd ..
          SKIP_CARGO_BUILD=1 ./scripts/package-dmg.sh arm64
          SKIP_CARGO_BUILD=1 ./scripts/package-pkg.sh arm64

      - name: Package .app + DMG + PKG (x86_64)
        run: |
          mkdir -p target/release
          cp target/x86_64-apple-darwin/release/stock target/release/stock
          SKIP_CARGO_BUILD=1 ./scripts/package-macos.sh
          cd dist
          ditto -c -k --keepParent "ZStock.app" zstock-macos-x64.zip
          cd ..
          SKIP_CARGO_BUILD=1 ./scripts/package-dmg.sh x64
          SKIP_CARGO_BUILD=1 ./scripts/package-pkg.sh x64

      - name: Hash packages
        id: hash
        run: |
          echo "arm64=$(shasum -a 256 dist/zstock-macos-arm64.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "x64=$(shasum -a 256 dist/zstock-macos-x64.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zstock-macos
          if-no-files-found: error
          path: dist/zstock-macos-*

  linux:
    name: Linux (x64)
    needs: [resolve, quality]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify version matches tag
        if: needs.resolve.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          cargo_version="$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml | head -1)"
          tag_version="${RELEASE_TAG#v}"
          if [ -z "$cargo_version" ] || [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::Version mismatch: Cargo.toml=${cargo_version:-<missing>} tag=${tag_version}"
            exit 1
          fi
          echo "OK: Cargo.toml version ${cargo_version} matches tag ${tag_version}"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev

      - name: Build release
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist/zstock-linux-x64/icons/hicolor/256x256/apps
          mkdir -p dist/zstock-linux-x64/icons/hicolor/512x512/apps
          cp target/release/stock dist/zstock-linux-x64/
          cp README.md dist/zstock-linux-x64/
          cp assets/linux/zstock.desktop dist/zstock-linux-x64/
          cp scripts/install-linux.sh dist/zstock-linux-x64/install.sh
          chmod +x dist/zstock-linux-x64/install.sh
          cp assets/linux/icons/hicolor/256x256/apps/zstock.png dist/zstock-linux-x64/icons/hicolor/256x256/apps/
          cp assets/linux/icons/hicolor/512x512/apps/zstock.png dist/zstock-linux-x64/icons/hicolor/512x512/apps/
          cd dist
          zip -r zstock-linux-x64.zip zstock-linux-x64

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zstock-linux-x64
          if-no-files-found: error
          path: dist/zstock-linux-x64.zip

  manifest:
    permissions:
      contents: write
    name: Publish complete release and stable manifest
    needs: [resolve, macos, windows, linux]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-stable-release
      cancel-in-progress: false
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}

      - name: Collect all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: zstock-*
          path: release-assets
          merge-multiple: true

      - name: Generate updates/stable.json from built packages
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          sha() { sha256sum "release-assets/zstock-$1.zip" | awk '{print $1}'; }
          bash scripts/update-manifest.sh "$TAG" \
            "$(sha macos-arm64)" "$(sha macos-x64)" \
            "$(sha windows-x64)" "$(sha linux-x64)"

      - name: Sign update manifest with owner-controlled release key
        env:
          ZSTOCK_UPDATE_SIGNING_KEY: ${{ secrets.ZSTOCK_UPDATE_SIGNING_KEY }}
        run: node scripts/sign-update.cjs

      # The helper validates every uploaded asset before making the draft public.
      # Only then is stable.json advanced, with a non-force main ref update.
      - name: Publish verified release and commit manifest
        uses: actions/github-script@v7
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          PUBLICATION_HEAD: ${{ needs.resolve.outputs.publication_head }}
        with:
          script: |
            const { publishRelease } = require('./scripts/publish-release.cjs');
            await publishRelease({ github, context, core, tag: process.env.TAG,
              sourceSha: process.env.SOURCE_SHA, publicationHead: process.env.PUBLICATION_HEAD });
