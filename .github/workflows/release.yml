name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cargo_version="$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml | head -1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ -z "$cargo_version" ] || [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::Version mismatch: Cargo.toml=${cargo_version:-<missing>} tag=${tag_version}"
            exit 1
          fi
          echo "OK: Cargo.toml version ${cargo_version} matches tag ${tag_version}"

      - name: Build release
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\stock-windows-x64 | Out-Null
          Copy-Item target\release\stock.exe dist\stock-windows-x64\
          Copy-Item README.md dist\stock-windows-x64\ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\stock-windows-x64 -DestinationPath dist\stock-analysis-windows-x64.zip -Force

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/stock-analysis-windows-x64.zip
          generate_release_notes: true

      - name: Upload artifact (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: stock-analysis-windows-x64
          path: dist/stock-analysis-windows-x64.zip

  macos:
    name: macOS (arm64 + x64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cargo_version="$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml | head -1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ -z "$cargo_version" ] || [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::Version mismatch: Cargo.toml=${cargo_version:-<missing>} tag=${tag_version}"
            exit 1
          fi
          echo "OK: Cargo.toml version ${cargo_version} matches tag ${tag_version}"

      - name: Sync Info.plist version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          plutil -replace CFBundleShortVersionString -string "$tag_version" assets/macos/Info.plist
          plutil -replace CFBundleVersion -string "$tag_version" assets/macos/Info.plist

      - name: Build release (x86_64 + arm64)
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin

      - name: Package .app (arm64)
        run: |
          mkdir -p target/release
          cp target/aarch64-apple-darwin/release/stock target/release/stock
          SKIP_CARGO_BUILD=1 ./scripts/package-macos.sh
          cd dist
          ditto -c -k --keepParent "Stock Analysis.app" stock-analysis-macos-arm64.zip

      - name: Package .app (x86_64)
        run: |
          mkdir -p target/release
          cp target/x86_64-apple-darwin/release/stock target/release/stock
          SKIP_CARGO_BUILD=1 ./scripts/package-macos.sh
          cd dist
          ditto -c -k --keepParent "Stock Analysis.app" stock-analysis-macos-x64.zip

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/stock-analysis-macos-arm64.zip
            dist/stock-analysis-macos-x64.zip
          generate_release_notes: true

      - name: Upload artifact (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: stock-analysis-macos
          path: dist/stock-analysis-macos-*.zip
