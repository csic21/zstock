name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    outputs:
      windows_sha: ${{ steps.hash.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cargo_version="$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml | head -1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ -z "$cargo_version" ] || [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::Version mismatch: Cargo.toml=${cargo_version:-<missing>} tag=${tag_version}"
            exit 1
          fi
          echo "OK: Cargo.toml version ${cargo_version} matches tag ${tag_version}"

      - name: Build release
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\stock-windows-x64 | Out-Null
          Copy-Item target\release\stock.exe dist\stock-windows-x64\
          Copy-Item README.md dist\stock-windows-x64\ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\stock-windows-x64 -DestinationPath dist\stock-analysis-windows-x64.zip -Force

      - name: Hash package
        id: hash
        shell: bash
        run: echo "sha=$(shasum -a 256 dist/stock-analysis-windows-x64.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/stock-analysis-windows-x64.zip
          generate_release_notes: true

      - name: Upload artifact (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: stock-analysis-windows-x64
          path: dist/stock-analysis-windows-x64.zip

  macos:
    name: macOS (arm64 + x64)
    runs-on: macos-latest
    outputs:
      macos_arm64_sha: ${{ steps.hash.outputs.arm64 }}
      macos_x64_sha: ${{ steps.hash.outputs.x64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cargo_version="$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml | head -1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ -z "$cargo_version" ] || [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::Version mismatch: Cargo.toml=${cargo_version:-<missing>} tag=${tag_version}"
            exit 1
          fi
          echo "OK: Cargo.toml version ${cargo_version} matches tag ${tag_version}"

      - name: Sync Info.plist version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          plutil -replace CFBundleShortVersionString -string "$tag_version" assets/macos/Info.plist
          plutil -replace CFBundleVersion -string "$tag_version" assets/macos/Info.plist

      - name: Build release (x86_64 + arm64)
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin

      - name: Package .app (arm64)
        run: |
          mkdir -p target/release
          cp target/aarch64-apple-darwin/release/stock target/release/stock
          SKIP_CARGO_BUILD=1 ./scripts/package-macos.sh
          cd dist
          ditto -c -k --keepParent "ZStock.app" stock-analysis-macos-arm64.zip

      - name: Package .app (x86_64)
        run: |
          mkdir -p target/release
          cp target/x86_64-apple-darwin/release/stock target/release/stock
          SKIP_CARGO_BUILD=1 ./scripts/package-macos.sh
          cd dist
          ditto -c -k --keepParent "ZStock.app" stock-analysis-macos-x64.zip

      - name: Hash packages
        id: hash
        run: |
          echo "arm64=$(shasum -a 256 dist/stock-analysis-macos-arm64.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "x64=$(shasum -a 256 dist/stock-analysis-macos-x64.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/stock-analysis-macos-arm64.zip
            dist/stock-analysis-macos-x64.zip
          generate_release_notes: true

      - name: Upload artifact (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: stock-analysis-macos
          path: dist/stock-analysis-macos-*.zip

  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cargo_version="$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml | head -1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ -z "$cargo_version" ] || [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::Version mismatch: Cargo.toml=${cargo_version:-<missing>} tag=${tag_version}"
            exit 1
          fi
          echo "OK: Cargo.toml version ${cargo_version} matches tag ${tag_version}"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev

      - name: Build release
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist/stock-linux-x64
          cp target/release/stock dist/stock-linux-x64/
          cp README.md dist/stock-linux-x64/
          cd dist
          zip -r stock-analysis-linux-x64.zip stock-linux-x64

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/stock-analysis-linux-x64.zip
          generate_release_notes: true

      - name: Upload artifact (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: stock-analysis-linux-x64
          path: dist/stock-analysis-linux-x64.zip

  manifest:
    name: Update stable manifest
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate updates/stable.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd "$RUNNER_TEMP"
          for p in macos-arm64 macos-x64 windows-x64 linux-x64; do
            curl -fsSL -o "$p.zip" "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/stock-analysis-$p.zip" \
              || { echo "::error::failed to download $p.zip for $TAG"; exit 1; }
          done
          SHA_ARM64="$(shasum -a 256 macos-arm64.zip | awk '{print $1}')"
          SHA_X64="$(shasum -a 256 macos-x64.zip | awk '{print $1}')"
          SHA_WIN="$(shasum -a 256 windows-x64.zip | awk '{print $1}')"
          SHA_LINUX="$(shasum -a 256 linux-x64.zip | awk '{print $1}')"
          echo "TAG=$TAG arm64=$SHA_ARM64 x64=$SHA_X64 win=$SHA_WIN linux=$SHA_LINUX"
          test -n "$SHA_ARM64" && test -n "$SHA_X64" && test -n "$SHA_WIN" && test -n "$SHA_LINUX" \
            || { echo "::error::hash computation failed"; exit 1; }
          bash "$GITHUB_WORKSPACE/scripts/update-manifest.sh" "$TAG" "$SHA_ARM64" "$SHA_X64" "$SHA_WIN" "$SHA_LINUX" \
            || { echo "::error::update-manifest.sh failed"; exit 1; }
          cat "$GITHUB_WORKSPACE/updates/stable.json"

      - name: Commit manifest to main
        uses: actions/github-script@v7
        env:
          TAG: ${{ github.ref_name }}
        with:
          script: |
            try {
              const fs = require("fs");
              const content = fs.readFileSync("updates/stable.json", "utf8");
              let sha;
              try {
                const existing = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: "updates/stable.json",
                  ref: "main",
                });
                sha = existing.data.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: "updates/stable.json",
                message: `chore(update): publish stable manifest for ${process.env.TAG}`,
                content: Buffer.from(content).toString("base64"),
                ...(sha ? { sha } : {}),
                branch: "main",
              });
            } catch (error) {
              core.error(`manifest commit failed: ${error.message}`);
              throw error;
            }
