name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  windows:
    name: Windows (x64)
    needs: quality
    runs-on: windows-latest
    outputs:
      windows_sha: ${{ steps.hash.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cargo_version="$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml | head -1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ -z "$cargo_version" ] || [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::Version mismatch: Cargo.toml=${cargo_version:-<missing>} tag=${tag_version}"
            exit 1
          fi
          echo "OK: Cargo.toml version ${cargo_version} matches tag ${tag_version}"

      - name: Build release
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\zstock-windows-x64 | Out-Null
          Copy-Item target\release\stock.exe dist\zstock-windows-x64\
          Copy-Item README.md dist\zstock-windows-x64\ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\zstock-windows-x64 -DestinationPath dist\zstock-windows-x64.zip -Force

      - name: Compute version
        id: version
        shell: bash
        run: |
          cargo_version="$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml | head -1)"
          test -n "$cargo_version" || { echo "::error::could not read version from Cargo.toml"; exit 1; }
          echo "ver=${cargo_version}" >> "$GITHUB_OUTPUT"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" -ErrorAction Stop
          & $iscc.FullName "/DAppVersion=${{ steps.version.outputs.ver }}" "assets\windows\installer.iss"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ISCC failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          if (-not (Test-Path "dist\zstock-windows-x64-setup.exe")) {
            Write-Error "installer was not produced"
            exit 1
          }

      - name: Hash package
        id: hash
        shell: bash
        run: echo "sha=$(shasum -a 256 dist/zstock-windows-x64.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/zstock-windows-x64.zip
            dist/zstock-windows-x64-setup.exe
          generate_release_notes: true

      - name: Upload artifact (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: zstock-windows-x64
          path: |
            dist/zstock-windows-x64.zip
            dist/zstock-windows-x64-setup.exe

  macos:
    name: macOS (arm64 + x64)
    needs: quality
    runs-on: macos-15
    outputs:
      macos_arm64_sha: ${{ steps.hash.outputs.arm64 }}
      macos_x64_sha: ${{ steps.hash.outputs.x64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cargo_version="$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml | head -1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ -z "$cargo_version" ] || [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::Version mismatch: Cargo.toml=${cargo_version:-<missing>} tag=${tag_version}"
            exit 1
          fi
          echo "OK: Cargo.toml version ${cargo_version} matches tag ${tag_version}"

      - name: Sync Info.plist version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          plutil -replace CFBundleShortVersionString -string "$tag_version" assets/macos/Info.plist
          plutil -replace CFBundleVersion -string "$tag_version" assets/macos/Info.plist

      - name: Build release (x86_64 + arm64)
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin

      - name: Package .app + DMG + PKG (arm64)
        run: |
          mkdir -p target/release
          cp target/aarch64-apple-darwin/release/stock target/release/stock
          SKIP_CARGO_BUILD=1 ./scripts/package-macos.sh
          cd dist
          ditto -c -k --keepParent "ZStock.app" zstock-macos-arm64.zip
          cd ..
          SKIP_CARGO_BUILD=1 ./scripts/package-dmg.sh arm64
          SKIP_CARGO_BUILD=1 ./scripts/package-pkg.sh arm64

      - name: Package .app + DMG + PKG (x86_64)
        run: |
          mkdir -p target/release
          cp target/x86_64-apple-darwin/release/stock target/release/stock
          SKIP_CARGO_BUILD=1 ./scripts/package-macos.sh
          cd dist
          ditto -c -k --keepParent "ZStock.app" zstock-macos-x64.zip
          cd ..
          SKIP_CARGO_BUILD=1 ./scripts/package-dmg.sh x64
          SKIP_CARGO_BUILD=1 ./scripts/package-pkg.sh x64

      - name: Hash packages
        id: hash
        run: |
          echo "arm64=$(shasum -a 256 dist/zstock-macos-arm64.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "x64=$(shasum -a 256 dist/zstock-macos-x64.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/zstock-macos-arm64.zip
            dist/zstock-macos-arm64.dmg
            dist/zstock-macos-arm64.pkg
            dist/zstock-macos-x64.zip
            dist/zstock-macos-x64.dmg
            dist/zstock-macos-x64.pkg
          generate_release_notes: true

      - name: Upload artifact (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: zstock-macos
          path: dist/zstock-macos-*

  linux:
    name: Linux (x64)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cargo_version="$(sed -nE 's/^version = "([^"]+)".*/\1/p' Cargo.toml | head -1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ -z "$cargo_version" ] || [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::Version mismatch: Cargo.toml=${cargo_version:-<missing>} tag=${tag_version}"
            exit 1
          fi
          echo "OK: Cargo.toml version ${cargo_version} matches tag ${tag_version}"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev

      - name: Build release
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist/zstock-linux-x64/icons/hicolor/256x256/apps
          mkdir -p dist/zstock-linux-x64/icons/hicolor/512x512/apps
          cp target/release/stock dist/zstock-linux-x64/
          cp README.md dist/zstock-linux-x64/
          cp assets/linux/zstock.desktop dist/zstock-linux-x64/
          cp scripts/install-linux.sh dist/zstock-linux-x64/install.sh
          chmod +x dist/zstock-linux-x64/install.sh
          cp assets/linux/icons/hicolor/256x256/apps/zstock.png dist/zstock-linux-x64/icons/hicolor/256x256/apps/
          cp assets/linux/icons/hicolor/512x512/apps/zstock.png dist/zstock-linux-x64/icons/hicolor/512x512/apps/
          cd dist
          zip -r zstock-linux-x64.zip zstock-linux-x64

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/zstock-linux-x64.zip
          generate_release_notes: true

      - name: Upload artifact (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: zstock-linux-x64
          path: dist/zstock-linux-x64.zip

  manifest:
    name: Update stable manifest
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # Checkout the *tag* (default ref), not main. Asset naming lives in the
      # tagged tree (workflow + update-manifest.sh); writing stable.json to
      # main is done via the contents API below.
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Generate updates/stable.json
        env:
          TAG: ${{ github.ref_name }}
          ASSET_PREFIX: zstock
        run: |
          cd "$RUNNER_TEMP"
          for p in macos-arm64 macos-x64 windows-x64 linux-x64; do
            curl -fsSL -o "$p.zip" \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/${ASSET_PREFIX}-$p.zip" \
              || { echo "::error::failed to download ${ASSET_PREFIX}-$p.zip for $TAG"; exit 1; }
          done
          SHA_ARM64="$(shasum -a 256 macos-arm64.zip | awk '{print $1}')"
          SHA_X64="$(shasum -a 256 macos-x64.zip | awk '{print $1}')"
          SHA_WIN="$(shasum -a 256 windows-x64.zip | awk '{print $1}')"
          SHA_LINUX="$(shasum -a 256 linux-x64.zip | awk '{print $1}')"
          echo "TAG=$TAG arm64=$SHA_ARM64 x64=$SHA_X64 win=$SHA_WIN linux=$SHA_LINUX"
          test -n "$SHA_ARM64" && test -n "$SHA_X64" && test -n "$SHA_WIN" && test -n "$SHA_LINUX" \
            || { echo "::error::hash computation failed"; exit 1; }
          ASSET_PREFIX="$ASSET_PREFIX" bash "$GITHUB_WORKSPACE/scripts/update-manifest.sh" \
            "$TAG" "$SHA_ARM64" "$SHA_X64" "$SHA_WIN" "$SHA_LINUX" \
            || { echo "::error::update-manifest.sh failed"; exit 1; }
          # Guard against a future script/workflow naming drift.
          if ! grep -q "\"url\".*/${ASSET_PREFIX}-macos-arm64.zip\"" "$GITHUB_WORKSPACE/updates/stable.json"; then
            echo "::error::stable.json asset URLs do not match ASSET_PREFIX=${ASSET_PREFIX}"
            cat "$GITHUB_WORKSPACE/updates/stable.json"
            exit 1
          fi
          cat "$GITHUB_WORKSPACE/updates/stable.json"

      - name: Commit manifest to main
        uses: actions/github-script@v7
        env:
          TAG: ${{ github.ref_name }}
        with:
          script: |
            try {
              const fs = require("fs");
              const content = fs.readFileSync("updates/stable.json", "utf8");
              let sha;
              try {
                const existing = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: "updates/stable.json",
                  ref: "main",
                });
                sha = existing.data.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: "updates/stable.json",
                message: `chore(update): publish stable manifest for ${process.env.TAG}`,
                content: Buffer.from(content).toString("base64"),
                ...(sha ? { sha } : {}),
                branch: "main",
              });
            } catch (error) {
              core.error(`manifest commit failed: ${error.message}`);
              throw error;
            }
