name: Native credential-store smoke tests

on:
  workflow_dispatch:
  schedule:
    - cron: "35 19 * * 0"

permissions:
  contents: read

jobs:
  native-secret:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Secret Service
            os: ubuntu-latest
          - name: Windows DPAPI
            os: windows-latest
          - name: macOS Keychain
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux Secret Service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 gnome-keyring libsecret-tools
      - name: Native credential round trip
        if: runner.os != 'Linux'
        run: cargo test native_secret_round_trip_smoke -- --ignored --nocapture
      - name: Linux Secret Service round trip
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -lc '
            eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
            cargo test native_secret_round_trip_smoke -- --ignored --nocapture
          '
