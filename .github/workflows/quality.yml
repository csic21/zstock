name: Quality

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            run_tests: true
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            run_tests: true
          - name: macOS (arm64)
            os: macos-15
            target: aarch64-apple-darwin
            run_tests: true
          - name: macOS (x64)
            os: macos-15-intel
            target: x86_64-apple-darwin
            run_tests: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev
      - name: Format
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --all-targets --target ${{ matrix.target }}
      - name: Clippy
        run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Offline tests
        if: matrix.run_tests
        run: cargo test --all-targets --target ${{ matrix.target }}
      - name: Core build without Work Mode
        run: cargo check --all-targets --target ${{ matrix.target }} --no-default-features
