name: Quality

on:
  workflow_call:
    inputs:
      source_sha:
        required: false
        type: string
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            run_tests: true
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            run_tests: true
          - name: macOS (arm64)
            os: macos-15
            target: aarch64-apple-darwin
            run_tests: true
          - name: macOS (x64)
            os: macos-15-intel
            target: x86_64-apple-darwin
            run_tests: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev \
            xvfb xauth xdotool imagemagick mesa-vulkan-drivers libvulkan1 fonts-noto-cjk \
            dbus-x11 gnome-keyring libsecret-tools
      - name: Release workflow regression tests
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: node --test scripts/*release.test.cjs
      - name: Format
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --all-targets --target ${{ matrix.target }}
      - name: Clippy
        run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Offline tests
        if: matrix.run_tests
        run: cargo test --all-targets --target ${{ matrix.target }} -- --test-threads=1
      - name: Native credential API dummy round trip
        if: runner.os != 'Linux'
        timeout-minutes: 2
        run: cargo test --locked --target ${{ matrix.target }} native_secret_round_trip_smoke -- --ignored --nocapture
      - name: Native Linux Secret Service dummy round trip
        if: runner.os == 'Linux'
        timeout-minutes: 2
        shell: bash
        run: |
          dbus-run-session -- bash -lc '
            eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
            cargo test --locked --target x86_64-unknown-linux-gnu native_secret_round_trip_smoke -- --ignored --nocapture
          '
      - name: Core build without Work Mode
        run: cargo check --all-targets --target ${{ matrix.target }} --no-default-features
      - name: Visual smoke runner checks
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/visual-smoke.sh
          python3 scripts/visual-smoke-check.test.py
      - name: Build native visual smoke binary
        if: runner.os == 'Linux'
        run: cargo build --locked --bin stock --target ${{ matrix.target }}
      - name: Native Linux visual smoke
        if: runner.os == 'Linux'
        timeout-minutes: 4
        run: |
          mkdir -p visual-smoke-artifacts
          timeout --signal=TERM --kill-after=15s 180s \
            xvfb-run --auto-servernum --error-file=visual-smoke-artifacts/xvfb.log \
            --server-args="-screen 0 1600x1000x24 -nolisten tcp" \
            bash scripts/visual-smoke.sh \
            target/${{ matrix.target }}/debug/stock visual-smoke-artifacts
      - name: Native Linux recovery-mode visual smoke
        if: runner.os == 'Linux'
        timeout-minutes: 4
        env:
          ZSTOCK_SMOKE_RECOVERY: '1'
        run: |
          mkdir -p visual-smoke-artifacts/recovery
          timeout --signal=TERM --kill-after=15s 180s \
            xvfb-run --auto-servernum --error-file=visual-smoke-artifacts/recovery/xvfb.log \
            --server-args="-screen 0 1600x1000x24 -nolisten tcp" \
            bash scripts/visual-smoke.sh \
            target/${{ matrix.target }}/debug/stock visual-smoke-artifacts/recovery
      - name: Preserve native visual smoke evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-visual-smoke
          path: visual-smoke-artifacts/
          if-no-files-found: warn
          retention-days: 14
