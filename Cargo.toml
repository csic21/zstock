[package]
name = "stock"
version = "0.2.0"
edition = "2024"
description = "A-share stock analysis desktop app built with GPUI"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crc32fast = "1"
dirs = "6"
encoding_rs = "0.8"
flate2 = "1"
# runtime_shaders avoids needing the Xcode Metal toolchain at compile time
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
gpui-component = "0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
ureq = { version = "2", features = ["json"] }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1.6"
cocoa = "0.26"
objc = "0.2.7"
