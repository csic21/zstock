[package]
name = "stock"
version = "0.0.42"
edition = "2024"
description = "A-share and Hong Kong stock analysis desktop app built with GPUI"
license = "MIT"

[features]
default = [
    "work-mode",
    "architecture_v2",
    "persistence_v2",
    "portfolio_currency_v2",
    "home_experience_v2",
    "decision_card_v1",
]
work-mode = []
architecture_v2 = []
persistence_v2 = []
portfolio_currency_v2 = []
home_experience_v2 = []
decision_card_v1 = []
# Expected only because legacy objc 0.2 macros reference this historical cfg.
cargo-clippy = []

# Optional: cargo install cargo-bundle && cargo bundle --release
[package.metadata.bundle]
name = "ZStock"
identifier = "com.karl.stock-analysis"
icon = ["assets/logo/app-icon.png"]
category = "Finance"
short_description = "A-share and Hong Kong stock analysis"
long_description = "A-share and Hong Kong stock analysis desktop app: watchlist, K-line, treasure scan."
osx_info_plist_exts = ["assets/macos/Info.plist"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
encoding_rs = "0.8"
# runtime_shaders avoids needing the Xcode Metal toolchain at compile time
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
gpui-component = "0.5.1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
smol = "2"
sysinfo = "0.31"
ureq = { version = "2", features = ["json"] }
zip = "2"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders", "test-support"] }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1.6"
cocoa = "0.26"
objc = "0.2.7"
